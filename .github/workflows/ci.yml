name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Format, lint, flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Check formatting
        run: |
          nix fmt
          git diff --exit-code
      - name: Dead code lint
        run: nix run nixpkgs#deadnix -- --fail --exclude hosts/laptop-nixos/hardware-configuration.nix -- .
      - name: Flake check
        # Evaluates both host configurations via the `checks` output, then
        # builds the checks and dev shells.
        run: nix flake check

  darwin:
    name: Darwin eval
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Evaluate darwin system
        run: nix eval .#darwinConfigurations.macbook.system.drvPath
