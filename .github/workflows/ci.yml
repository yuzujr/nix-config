name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint and flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Lint
        # Formatting, Nix lint, dead code, shell, and workflow checks. This is
        # the same script developers and agents run locally, so `nix fmt` +
        # statix + deadnix + shellcheck + actionlint cannot drift apart here.
        run: bash scripts/lint.sh
      - name: Flake check
        # Evaluates both host configurations via the `checks` output, then
        # builds the checks and dev shells.
        run: nix flake check
